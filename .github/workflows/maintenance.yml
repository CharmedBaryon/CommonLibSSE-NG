name: Scripted maintenance

on:
  push:
    branches: [ ng ]
  pull_request:
    branches: [ ng ]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    # Skip on fork PRs: the head branch does not exist on this repo (so the ref
    # checkout below fails), and the auto-commit step cannot push to a fork anyway.
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.head_ref || github.ref_name }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Generate CMake file lists
      run: python ${{ github.workspace }}/scripts/cmake_generate.py

    - name: Check for changes
      id: verify_diff
      run: |
        git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Commit and push changes
      if: |
        steps.verify_diff.outputs.changed == 'true' &&
        (github.event_name == 'push' || 
         github.event.pull_request.head.repo.full_name == github.repository)
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "chore: regenerate CMake file lists"
        commit_options: '--no-verify'
